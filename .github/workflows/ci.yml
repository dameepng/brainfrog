name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  lint-typecheck-test:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905fa189e4c376166672c3f2f237804 # v2.11.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Setup Antigravity mock binary
        run: |
          mkdir -p /tmp/bin
          touch /tmp/bin/agy
          chmod +x /tmp/bin/agy
          echo "ANTIGRAVITY_BIN=/tmp/bin/agy" >> $GITHUB_ENV

      - name: Syntax & compilation check
        run: |
          python -m compileall -q core security system1 system2 tests cli.py orchestrator.py

      - name: Secret Guard integrity validation
        run: |
          python -c "from security.git_guard import scan_staged_changes; print('Git Guard module loaded cleanly')"

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests
