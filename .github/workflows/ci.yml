name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  lint-typecheck-test:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Setup Antigravity mock binary
        run: |
          mkdir -p /tmp/bin
          touch /tmp/bin/agy
          chmod +x /tmp/bin/agy
          echo "ANTIGRAVITY_BIN=/tmp/bin/agy" >> $GITHUB_ENV

      - name: Syntax and lint check (compileall)
        run: |
          python -m compileall -q core security system1 system2 tests cli.py orchestrator.py

      - name: Secret Guard integrity validation
        run: |
          python -c "from security.git_guard import scan_staged_changes; print('Git Guard module loaded cleanly')"

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests
