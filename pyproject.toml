[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainfrog"
version = "0.1.0"
description = "BrainFrog — Dual-System Coding Agent (Jev System 1 + Claude System 2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0.0",
]

[project.scripts]
brainfrog = "cli:main"
bf = "cli:main"

[tool.setuptools]
py-modules = ["cli", "orchestrator", "config", "modules", "plans", "memory", "skills", "auth_manager", "git_guard"]
packages = ["core", "security", "system1", "system2", "tests"]

[tool.pyrefly]
search-path = [".github/scripts"]

[tool.pyright]
extraPaths = [".github/scripts"]

